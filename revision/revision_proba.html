<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révisions Probabilités – DST BUT 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#eef2f9;--grid:#d9e2f2;--surface:#ffffff;--surface2:#f1f4fa;--text:#14213d;--muted:#5a6580;--line:#cfd8ea;
  --accent:#2447d6;--accent-ink:#ffffff;--accent-soft:#e2e8fc;
  --red:#cf3a3a;--red-soft:#fdeceb;
  --good:#13783a;--good-soft:#dcf2e2;--bad:#b3261e;--bad-soft:#fde3e1;--warn:#8a5a00;--warn-soft:#fcf0cc;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1526;--grid:#17223b;--surface:#16203a;--surface2:#1d2948;--text:#e8ecf7;--muted:#9ba7c6;--line:#2c3a5e;
    --accent:#8aa5ff;--accent-ink:#0b1230;--accent-soft:#25325c;
    --red:#ff8080;--red-soft:#3a1d24;
    --good:#62d68b;--good-soft:#163222;--bad:#ff8a80;--bad-soft:#3b1b1a;--warn:#f2c260;--warn-soft:#372a0c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1526;--grid:#17223b;--surface:#16203a;--surface2:#1d2948;--text:#e8ecf7;--muted:#9ba7c6;--line:#2c3a5e;
  --accent:#8aa5ff;--accent-ink:#0b1230;--accent-soft:#25325c;
  --red:#ff8080;--red-soft:#3a1d24;
  --good:#62d68b;--good-soft:#163222;--bad:#ff8a80;--bad-soft:#3b1b1a;--warn:#f2c260;--warn-soft:#372a0c;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--text);font:17px/1.6 var(--serif);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  min-height:100vh;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
h1,h2,h3,h4{font-family:var(--sans);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.65rem;font-weight:700;margin-top:.2em}
h3{font-size:1.15rem;font-weight:700}
p{margin:.5em 0}
a{color:var(--accent)}
b,strong{font-weight:600}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px 0;max-width:920px;margin:0 auto}
.brand strong{font:700 1.05rem var(--sans)}
.brand span{color:var(--muted);font:500 .85rem var(--sans);margin-left:8px}
.icon{border:1px solid var(--line);background:var(--surface2);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 10px;scrollbar-width:none;max-width:920px;margin:0 auto}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;text-decoration:none;color:var(--text);font:500 .9rem var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.nav a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.lead{font-size:1.08rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card>h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid .card{margin:0}
.eq{display:block;text-align:center;padding:.55rem .8rem;margin:.6rem 0;background:var(--surface2);border-radius:10px;overflow-x:auto;white-space:nowrap;font-size:1.08rem}
.mi{font-style:italic}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.2;font-size:.95em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em .06em}
.frac>span:last-child{padding:.06em .25em 0}
.binom{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;padding:0 .4em;line-height:1.15;font-size:.9em;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:9px/16px}
.ov{border-top:1.5px solid currentColor;padding-top:0}
.intg{font-size:1.5em;vertical-align:middle;line-height:1}
.lims{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.68em;line-height:1.1;vertical-align:middle;height:1.9em;margin:0 .3em 0 .05em}
sub,sup{line-height:0}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font:600 .85rem var(--sans);color:var(--muted)}
.scroll{overflow-x:auto}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.good{border-color:var(--good);background:var(--good-soft)}
.callout p:first-child{margin-top:0}.callout p:last-child{margin-bottom:0}
.callout .t{font:700 .95rem var(--sans);display:block;margin-bottom:2px}
ul,ol{padding-left:1.25em;margin:.4em 0}
li{margin:.25em 0}
.tool{border:2px solid var(--accent)}
.tool>h3::before{content:"✎ ";color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin:10px 0}
label.f{display:flex;flex-direction:column;gap:4px;font:500 .82rem var(--sans);color:var(--muted)}
input,select{font:16px var(--serif);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.out{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--surface2)}
.out .st{margin:.45em 0}
.res{display:inline-block;font:700 1rem var(--sans);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:1px 9px;margin-left:4px}
.btn{font:600 .95rem var(--sans);padding:9px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.seg>span{flex:1 1 220px;font:500 .95rem var(--sans)}
.seg button{font:600 .9rem var(--sans);padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font:500 .88rem var(--sans);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qa{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.qa:last-child{border-bottom:0}
.qn{flex:0 0 auto;font:700 .9rem var(--sans);color:var(--accent);min-width:2.1em}
.qb{flex:1;min-width:0}
details.sol{margin-top:6px}
details.sol summary{cursor:pointer;font:600 .9rem var(--sans);color:var(--red);list-style:none;display:inline-block;padding:3px 10px;border:1px solid var(--red);border-radius:999px}
details.sol summary::-webkit-details-marker{display:none}
details.sol[open] summary{background:var(--red-soft)}
.solbody{margin-top:8px;padding:8px 12px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 10px 10px 0}
.solbody p:first-child{margin-top:0}.solbody p:last-child{margin-bottom:0}
.law h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.law .tag{font:500 .8rem var(--sans);color:var(--muted)}
.law .eq{font-size:1rem;text-align:left}
svg.plot{width:100%;height:auto;display:block;margin-top:8px}
.pl-line{fill:none;stroke:var(--accent);stroke-width:2.5}
.pl-fill{fill:var(--accent);opacity:.28}
.pl-axis{stroke:var(--muted);stroke-width:1}
.pl-txt{fill:var(--muted);font:11px var(--sans)}
.bar{fill:var(--accent);opacity:.5}
.bar.hi{opacity:1;fill:var(--red)}
.tr-l{stroke:var(--muted);stroke-width:1.5}
.tr-n{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.tr-t{fill:var(--text);font:700 15px var(--sans)}
.tr-e{fill:var(--text);font:13px var(--sans)}
.tr-p{fill:var(--accent);font:700 13px var(--sans)}
.tr-s{fill:var(--muted);font:11px var(--sans)}
.cols{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.col{display:flex;flex-direction:column;gap:6px;min-width:74px;flex:0 0 74px}
.col span{font:500 .75rem var(--sans);color:var(--muted)}
.hometop{padding:6px 0 4px}
.hometop h1{font-size:2.3rem;max-width:16ch}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;display:flex;gap:10px;margin:.5em 0}
.steps li::before{content:counter(s);flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .85rem/26px var(--sans);text-align:center}
.chcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--text)}
.chcard h3{margin:0}
.chcard p{margin:0;color:var(--muted);font-size:.93rem}
.chcard .meta{font:500 .82rem var(--sans);color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.chcard .ok{color:var(--good);font-weight:700}
.pager{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:22px}
.pager a,.pager button{text-decoration:none}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 14px}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.qbox{font-size:1.05rem}
.choice{display:block;width:100%;text-align:left;font:500 .98rem var(--serif);padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:12px;padding:10px 14px;border-radius:10px}
.fb.good{background:var(--good-soft);border-left:4px solid var(--good)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.flash{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border:2px solid var(--accent);border-radius:16px;background:var(--surface);cursor:pointer;font-size:1.1rem;user-select:none}
.flash.back{background:var(--accent-soft)}
.flash .hint{display:block;font:500 .8rem var(--sans);color:var(--muted);margin-top:10px}
.big{font:700 2.4rem var(--sans)}
.fl{margin:.35em 0}
.warnt{color:var(--bad);font-weight:600}

.sjgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:10px 0}
.dlrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.dlmsg{min-height:1.4em;color:var(--muted);font:500 .9rem var(--sans);margin-top:6px}
.sjcard h3{margin-bottom:2px}
.sjcard .sub{color:var(--muted);margin:0 0 8px}
@media (max-width:520px){body{font-size:16px}h1{font-size:1.7rem}.hometop h1{font-size:1.9rem}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<script>
(function(){
"use strict";

/* ================= utilitaires ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const num=v=>parseFloat(String(v).replace(/\u2212/g,'-').replace(',','.').replace(/\s/g,''));
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function fmt(x,d=3){
  if(x===null||x===undefined||!isFinite(x))return '—';
  let s=(Math.round((x+Number.EPSILON)*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
  if(s.indexOf('.')>=0)s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0')s='0';
  return s.replace('.',',').replace('-','\u2212');
}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;};
const fr=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const bn=(n,k)=>`<span class="binom"><span>${n}</span><span>${k}</span></span>`;
const sup=x=>`<sup>${x}</sup>`;
const sub=x=>`<sub>${x}</sub>`;
const ov=x=>`<span class="ov">${x}</span>`;
const eq=h=>`<div class="eq">${h}</div>`;
const lim=(a,b)=>`<span class="lims"><span>${b}</span><span>${a}</span></span>`;
const integ=(a,b)=>`<span class="intg">∫</span>${lim(a,b)}`;
const sol=(t,h)=>`<details class="sol"><summary>${t}</summary><div class="solbody">${h}</div></details>`;
const qa=(n,q,a)=>`<div class="qa"><div class="qn">${n}</div><div class="qb"><div>${q}</div>${sol('Voir le corrigé',a)}</div></div>`;
const callout=(t,h,k='')=>`<div class="callout ${k}"><span class="t">${t}</span>${h}</div>`;
function fracHTML(n,d){
  if(d<0){n=-n;d=-d;}
  const g=gcd(n,d)||1;n/=g;d/=g;
  const sn=String(n).replace('-','\u2212');
  return d===1?sn:fr(sn,d);
}
const fmtInt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');

/* ================= stockage ================= */
const STORE_KEY='proba-bt2-v1';
let state={done:{},best:{},cards:{},scores:{}};
try{const s=localStorage.getItem(STORE_KEY);if(s){const o=JSON.parse(s);state=Object.assign(state,o);}}catch(e){}
if(!state.scores)state.scores={};
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}

/* ================= maths ================= */
const factB=n=>{let r=1n;for(let i=2;i<=n;i++)r*=BigInt(i);return r;};
const permB=(n,k)=>{let r=1n;for(let i=0;i<k;i++)r*=BigInt(n-i);return r;};
const combB=(n,k)=>{if(k<0||k>n)return 0n;k=Math.min(k,n-k);let r=1n;for(let i=1;i<=k;i++){r=r*BigInt(n-k+i)/BigInt(i);}return r;};
const big=b=>fmtInt(b.toString());
const lfC=[0,0];
function lf(n){for(let i=lfC.length;i<=n;i++)lfC[i]=lfC[i-1]+Math.log(i);return lfC[n];}
const lnC=(n,k)=>lf(n)-lf(k)-lf(n-k);
function Phi(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989422804*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?1-p:p;
}
function invPhi(p){let lo=-10,hi=10;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(Phi(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}
const TABLE={0.5:0.6915,0.84:0.8,1:0.8413,1.28:0.9,1.5:0.9332,1.64:0.95,1.96:0.975,2:0.9772,2.5:0.9938};

/* ================= graphiques ================= */
function plot(o){
  const W=600,H=250,m={l:30,r:14,t:12,b:28};
  const xmin=o.xmin,xmax=o.xmax,ymax=o.ymax;
  const sx=x=>m.l+(x-xmin)/(xmax-xmin)*(W-m.l-m.r);
  const sy=y=>H-m.b-y/ymax*(H-m.t-m.b);
  let xs=[];const N=240;
  for(let i=0;i<=N;i++)xs.push(xmin+(xmax-xmin)*i/N);
  (o.jumps||[]).forEach(j=>{xs.push(j-1e-9,j+1e-9);});
  xs.sort((a,b)=>a-b);
  let d='';xs.forEach((x,i)=>{d+=(i?'L':'M')+sx(x).toFixed(1)+' '+sy(o.f(x)).toFixed(1);});
  let fill='';
  if(o.shade){
    const lo=Math.max(o.shade[0],xmin),hi=Math.min(o.shade[1],xmax);
    if(hi>lo){
      let pts=[lo,hi];(o.jumps||[]).forEach(j=>{if(j>lo&&j<hi)pts.push(j-1e-9,j+1e-9);});
      for(let i=1;i<120;i++)pts.push(lo+(hi-lo)*i/120);
      pts.sort((a,b)=>a-b);
      let p=`M${sx(lo).toFixed(1)} ${sy(0).toFixed(1)}`;
      pts.forEach(x=>{p+=`L${sx(x).toFixed(1)} ${sy(o.f(x)).toFixed(1)}`;});
      p+=`L${sx(hi).toFixed(1)} ${sy(0).toFixed(1)}Z`;
      fill=`<path class="pl-fill" d="${p}"/>`;
    }
  }
  let ax=`<line class="pl-axis" x1="${m.l}" y1="${sy(0)}" x2="${W-m.r}" y2="${sy(0)}"/>`;
  (o.ticks||[]).forEach(t=>{ax+=`<line class="pl-axis" x1="${sx(t[0])}" y1="${sy(0)}" x2="${sx(t[0])}" y2="${sy(0)+5}"/><text class="pl-txt" x="${sx(t[0])}" y="${H-10}" text-anchor="middle">${t[1]}</text>`;});
  (o.yticks||[]).forEach(t=>{ax+=`<line class="pl-axis" x1="${m.l-4}" y1="${sy(t[0])}" x2="${m.l}" y2="${sy(t[0])}"/><text class="pl-txt" x="${m.l-7}" y="${sy(t[0])+4}" text-anchor="end">${t[1]}</text>`;});
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||'Graphique'}">${fill}<path class="pl-line" d="${d}"/>${ax}</svg>`;
}
function bars(data,hiFn,label){
  const W=600,H=230,m={l:34,r:10,t:12,b:26};
  const n=data.length;if(!n)return '';
  const mx=Math.max(...data.map(d=>d.p),1e-9)*1.12;
  const bw=(W-m.l-m.r)/n;
  const step=Math.ceil(n/18);
  let s='';
  data.forEach((d,i)=>{
    const h=(d.p/mx)*(H-m.t-m.b);
    s+=`<rect class="bar${hiFn(d.k)?' hi':''}" x="${(m.l+i*bw+bw*0.12).toFixed(1)}" y="${(H-m.b-h).toFixed(1)}" width="${(bw*0.76).toFixed(1)}" height="${Math.max(h,0.5).toFixed(1)}" rx="2"/>`;
    if(i%step===0)s+=`<text class="pl-txt" x="${(m.l+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.k}</text>`;
  });
  s+=`<line class="pl-axis" x1="${m.l}" y1="${H-m.b}" x2="${W-m.r}" y2="${H-m.b}"/>`;
  s+=`<text class="pl-txt" x="${m.l-5}" y="${m.t+8}" text-anchor="end">${fmt(mx/1.12,2)}</text>`;
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label||'Diagramme en bâtons'}">${s}</svg>`;
}

/* ================= lois discrètes ================= */
const LAWS={
 bern:{name:'Bernoulli B(p)',params:[['p','p','0,03']],k0:1,
  ok:P=>(P.p>=0&&P.p<=1)?'':'p doit être compris entre 0 et 1.',
  lo:()=>0,hi:()=>1,cr:()=>[0,1],
  pmf:(k,P)=>k===1?P.p:(k===0?1-P.p:0),
  E:P=>P.p,V:P=>P.p*(1-P.p),
  expr:(k,P)=>k===1?`P(X = 1) = p = ${fmt(P.p,5)}`:`P(X = 0) = 1 − p = ${fmt(1-P.p,5)}`},
 binom:{name:'Binomiale B(n ; p)',params:[['n','n','50'],['p','p','0,03']],k0:0,
  ok:P=>(Number.isInteger(P.n)&&P.n>=1&&P.n<=2000)?((P.p>=0&&P.p<=1)?'':'p doit être compris entre 0 et 1.'):'n doit être un entier entre 1 et 2000.',
  lo:()=>0,hi:P=>P.n,
  cr:P=>{const sd=Math.sqrt(P.n*P.p*(1-P.p));return [Math.max(0,Math.floor(P.n*P.p-4*sd)),Math.min(P.n,Math.ceil(P.n*P.p+4*sd)+1)];},
  pmf:(k,P)=>{if(k<0||k>P.n)return 0;if(P.p===0)return k===0?1:0;if(P.p===1)return k===P.n?1:0;return Math.exp(lnC(P.n,k)+k*Math.log(P.p)+(P.n-k)*Math.log(1-P.p));},
  E:P=>P.n*P.p,V:P=>P.n*P.p*(1-P.p),
  expr:(k,P)=>`P(Y = ${k}) = ${bn(P.n,k)} × ${fmt(P.p,5)}${sup(k)} × ${fmt(1-P.p,5)}${sup(P.n-k)}`},
 pois:{name:'Poisson P(λ)',params:[['l','λ','15']],k0:10,
  ok:P=>(P.l>0&&P.l<=300)?'':'λ doit être strictement positif (≤ 300).',
  lo:()=>0,hi:()=>Infinity,cr:P=>[0,Math.ceil(P.l+5*Math.sqrt(P.l)+3)],
  pmf:(k,P)=>k<0?0:Math.exp(-P.l+k*Math.log(P.l)-lf(k)),
  E:P=>P.l,V:P=>P.l,
  expr:(k,P)=>`P(X = ${k}) = e${sup('−'+fmt(P.l,5))} × ${fr(fmt(P.l,5)+sup(k),k+'!')}`},
 geom:{name:'Géométrique G(p)',params:[['p','p',fmt(1/6,4)]],k0:4,
  ok:P=>(P.p>0&&P.p<=1)?'':'p doit être dans ]0 ; 1].',
  lo:()=>1,hi:()=>Infinity,cr:P=>[1,Math.min(30,Math.max(6,Math.ceil(4/P.p)))],
  pmf:(k,P)=>k<1?0:Math.pow(1-P.p,k-1)*P.p,
  E:P=>1/P.p,V:P=>(1-P.p)/(P.p*P.p),
  expr:(k,P)=>`P(Z = ${k}) = (1 − p)${sup(k-1)} × p = ${fmt(1-P.p,5)}${sup(k-1)} × ${fmt(P.p,5)}`},
 hyper:{name:'Hypergéométrique H(N ; n ; K)',params:[['N','N','30'],['n','n','5'],['K','K','6']],k0:2,
  ok:P=>(Number.isInteger(P.N)&&Number.isInteger(P.n)&&Number.isInteger(P.K)&&P.N>=1&&P.N<=2000&&P.K>=0&&P.K<=P.N&&P.n>=1&&P.n<=P.N)?'':'Il faut N, n, K entiers avec 0 ≤ K ≤ N et 1 ≤ n ≤ N.',
  lo:P=>Math.max(0,P.n-(P.N-P.K)),hi:P=>Math.min(P.n,P.K),
  cr:P=>[Math.max(0,P.n-(P.N-P.K)),Math.min(P.n,P.K)],
  pmf:(k,P)=>{if(k<Math.max(0,P.n-(P.N-P.K))||k>Math.min(P.n,P.K))return 0;return Math.exp(lnC(P.K,k)+lnC(P.N-P.K,P.n-k)-lnC(P.N,P.n));},
  E:P=>P.n*P.K/P.N,V:P=>P.n*(P.K/P.N)*(1-P.K/P.N)*(P.N-P.n)/(P.N-1||1),
  expr:(k,P)=>`P(W = ${k}) = ${fr(bn(P.K,k)+' × '+bn(P.N-P.K,P.n-k),bn(P.N,P.n))}`}
};
function cdf(L,P,k){let s=0;const lo=L.lo(P);for(let i=lo;i<=k;i++)s+=L.pmf(i,P);return Math.min(1,s);}

function initCh1(){
  const sel={order:1,rep:0,all:0};
  const out=$('#t1selout');
  function upd(){
    $('#allSeg').style.display=(sel.order&&!sel.rep)?'flex':'none';
    let name,f,why;
    if(sel.order&&sel.rep){name='p-uplets (tirage avec remise)';f='n'+sup('p');why='L’ordre compte et les répétitions sont possibles.';}
    else if(sel.order&&sel.all){name='Permutations';f='n!';why='On ordonne tous les éléments, sans répétition.';}
    else if(sel.order){name='Arrangements';f='A'+sub('n')+sup('p')+' = '+fr('n!','(n − p)!');why='L’ordre compte mais un élément ne peut pas être pris deux fois.';}
    else if(!sel.rep){name='Combinaisons';f=bn('n','p')+' = '+fr('n!','p!(n − p)!');why='L’ordre n’a pas d’importance et pas de répétition.';}
    else{name='Combinaisons avec répétition';f=bn('n + p − 1','p');why='Sans ordre mais avec répétitions. Cas rare, absent du sujet blanc.';}
    out.innerHTML=`<p><b>${name}</b></p>${eq(f)}<p>${why}</p>`;
  }
  $$('#t1sel .seg').forEach(seg=>seg.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    $$('button',seg).forEach(x=>x.classList.remove('on'));b.classList.add('on');
    sel[seg.dataset.k||'all']=parseInt(b.dataset.v,10);upd();
  }));
  $('#allSeg').dataset.k='all';
  upd();
  const calc=()=>{
    const n=parseInt($('#cn').value,10),p=parseInt($('#cp').value,10),o=$('#t1calcout');
    if(!(n>=0&&p>=0&&n<=60&&p<=60)){o.innerHTML='<p class="warnt">Entre deux entiers positifs (≤ 60).</p>';return;}
    let h=`<p class="st">p-uplets : n${sup('p')} = ${n}${sup(p)} <span class="res">${big(BigInt(n)**BigInt(p))}</span></p>`;
    if(p<=n){
      h+=`<p class="st">Arrangements : A${sub(n)}${sup(p)} <span class="res">${big(permB(n,p))}</span></p>`;
      h+=`<p class="st">Combinaisons : ${bn(n,p)} <span class="res">${big(combB(n,p))}</span></p>`;
    }else h+='<p class="st">Arrangements et combinaisons : impossibles si p &gt; n.</p>';
    h+=`<p class="st">Permutations : ${n}! <span class="res">${big(factB(n))}</span></p>`;
    o.innerHTML=h;
  };
  $('#t1calc').addEventListener('input',calc);calc();
  const ana=()=>{
    const w=$('#anaw').value.toUpperCase().replace(/[^A-ZÀ-ÖØ-Ý]/g,'');
    const o=$('#anaout');
    if(!w||w.length>20){o.innerHTML='<p class="warnt">Entre un mot de 1 à 20 lettres.</p>';return;}
    const cnt={};for(const c of w)cnt[c]=(cnt[c]||0)+1;
    const reps=Object.entries(cnt).filter(([,v])=>v>1);
    let den=1n;reps.forEach(([,v])=>den*=factB(v));
    const r=factB(w.length)/den;
    const dtxt=reps.length?reps.map(([c,v])=>v+'!').join(' × '):'';
    o.innerHTML=`<p>${w.length} lettres. ${reps.length?'Lettres répétées : '+reps.map(([c,v])=>`<b>${c}</b> ×${v}`).join(', ')+'.':'Toutes les lettres sont distinctes.'}</p>${eq(reps.length?fr(w.length+'!',dtxt):w.length+'!')}<p>Nombre de mots : <span class="res">${big(r)}</span></p>`;
  };
  $('#anaw').addEventListener('input',ana);ana();
  const mul=()=>{
    const H=parseInt($('#mH').value,10),F=parseInt($('#mF').value,10),h=parseInt($('#mh').value,10),f=parseInt($('#mf').value,10),o=$('#mulout');
    if([H,F,h,f].some(x=>!(x>=0))||h>H||f>F||H>60||F>60){o.innerHTML='<p class="warnt">Valeurs invalides (il faut h ≤ H et f ≤ F).</p>';return;}
    const a=combB(H,h),b=combB(F,f);
    o.innerHTML=`${eq(bn(F,f)+' × '+bn(H,h)+' = '+big(b)+' × '+big(a))}<p>Groupes possibles : <span class="res">${big(a*b)}</span></p>`;
  };
  $('#t1mul').addEventListener('input',mul);mul();
}

function renderCh2(){
  const PM=`P${sub('M')}(T)`,PMb=`P${sub(ov('M'))}(T)`;
  return `<h2>2. Probabilités élémentaires</h2>

   <tr><td>${PM}</td><td>probabilité que le test soit positif <b>sachant que</b> la personne est malade : 0,98</td></tr>
   <tr><td>${PMb}</td><td>probabilité que le test soit positif sachant que la personne n’est pas malade (faux positif) : 0,04</td></tr>
   <tr><td>P${sub(ov('M'))}(${ov('T')})</td><td>probabilité que le test soit négatif sachant que la personne n’est pas malade : 0,96</td></tr>
   <tr><td>${ov('M')} ∩ ${ov('T')}</td><td>la personne n’est pas malade <b>et</b> le test est négatif</td></tr>
   <tr><td>M ∪ T</td><td>la personne est malade <b>ou</b> le test est positif (ou les deux)</td></tr></table></div>
   ${callout('Lecture de P<sub>A</sub>(B)','<p>Se lit « probabilité de B sachant A ». On <b>se place dans le monde où A est vrai</b>, et on regarde B.</p>')}</div>
  <div class="card"><h3>Les 6 règles</h3>
   <p><b>Complément et branches :</b> les branches qui partent d’un même nœud ont une somme égale à 1.</p>${eq('P'+sub(ov('M'))+'('+ov('T')+') = 1 − P'+sub(ov('M'))+'(T) = 1 − 0,04 = 0,96')}
   <p><b>Intersection (on descend l’arbre en multipliant) :</b></p>${eq('P(A ∩ B) = P(A) × P'+sub('A')+'(B)')}
   <p><b>Probabilités totales</b> sur la partition {M, ${ov('M')}} :</p>${eq('P(T) = P(M ∩ T) + P('+ov('M')+' ∩ T)')}
   <p><b>Bayes</b> (inverser l’arbre) :</p>${eq('P'+sub('T')+'(M) = '+fr('P(M ∩ T)','P(T)'))}
   <p><b>Union :</b></p>${eq('P(A ∪ B) = P(A) + P(B) − P(A ∩ B)')}
   <p><b>Indépendance :</b> A et B sont indépendants si et seulement si</p>${eq('P(A ∩ B) = P(A) × P(B)')}</div>

  <div class="card tool" id="t2tree"><h3>Dépistage : arbre et calculs en direct</h3>
   <div class="fields"><label class="f">P(M) en %<input id="pM" inputmode="decimal" value="5"></label><label class="f">P<sub>M</sub>(T) en %<input id="pSe" inputmode="decimal" value="98"></label><label class="f">P<sub>M̄</sub>(T) en %<input id="pFp" inputmode="decimal" value="4"></label></div>
   <div id="treeBox"></div><div class="out" id="t2out"></div>
   <p style="color:var(--muted);font-size:.92rem">Essaie P(M) = 0,5 % : le test reste « fiable » mais la probabilité d’être malade sachant test positif s’effondre.</p></div>

  <div class="card"><h3>Questions du sujet (Exercice 2)</h3>
   ${qa('1','Traduire les données en probabilités.',`<p>${eq('P(M) = 0,05 ; '+PM+' = 0,98 ; '+PMb+' = 0,04')}</p>`)}
   ${qa('2',`Traduire ${ov('M')} ∩ ${ov('T')} en français.`,`<p>L’intersection se traduit par « ET » : <b>la personne n’est pas malade et le test est négatif</b>.</p>`)}
   ${qa('3',`Que représente P${sub(ov('M'))}(${ov('T')}) ? En déduire sa valeur.`,`<p>Probabilité que le test soit négatif, sachant que la personne n’est pas malade.</p>${eq('P'+sub(ov('M'))+'('+ov('T')+') = 1 − '+PMb+' = 1 − 0,04 = 0,96')}`)}
   ${qa('4','Construire l’arbre pondéré.',`<p>Premier niveau : M (0,05) et ${ov('M')} (0,95). Deuxième niveau : depuis M, T (0,98) et ${ov('T')} (0,02) ; depuis ${ov('M')}, T (0,04) et ${ov('T')} (0,96). Tu peux voir l’arbre dans l’outil ci-dessus.</p>`)}
   ${qa('5','Probabilité d’être malade <b>et</b> d’avoir un test positif.',`${eq('P(M ∩ T) = P(M) × '+PM+' = 0,05 × 0,98 = 0,049')}`)}
   ${qa('6','Montrer que P(T) = 0,087.',`<p>Formule des probabilités totales :</p>${eq('P(T) = P(M ∩ T) + P('+ov('M')+' ∩ T)')}${eq('P('+ov('M')+' ∩ T) = 0,95 × 0,04 = 0,038')}${eq('P(T) = 0,049 + 0,038 = 0,087')}`)}
   ${qa('7','Résultat positif : probabilité d’être réellement malade (arrondi à 10<sup>−3</sup>).',`<p>On cherche P${sub('T')}(M) : formule de Bayes.</p>${eq('P'+sub('T')+'(M) = '+fr('P(M ∩ T)','P(T)')+' = '+fr('0,049','0,087')+' ≈ 0,563')}`)}
   ${qa('8','Calculer P(M ∪ T) et dire ce que c’est.',`${eq('P(M ∪ T) = P(M) + P(T) − P(M ∩ T) = 0,05 + 0,087 − 0,049 = 0,088')}<p>C’est la probabilité que la personne soit malade <b>ou</b> que le test soit positif (ou les deux).</p>`)}
   ${qa('9','M et T sont-ils indépendants ?',`<p>On compare P(M ∩ T) et P(M) × P(T).</p>${eq('P(M ∩ T) = 0,049')}${eq('P(M) × P(T) = 0,05 × 0,087 = 0,00435')}<p>0,049 ≠ 0,00435 : les événements <b>ne sont pas indépendants</b> (heureusement : un test doit dépendre de la maladie).</p>`)}
  </div>
  <div class="card"><h3>Pièges</h3><ul>
   <li>${PM} n’est pas P${sub('T')}(M) : « positif sachant malade » n’est pas « malade sachant positif ».</li>
   <li>Union : ne pas oublier de retrancher P(A ∩ B).</li>
   <li>Indépendant ≠ incompatible. Pour l’indépendance, on fait toujours le calcul du produit.</li></ul></div>
  ${chapterFooter('ch2')}`;
}
function treeSVG(pM,se,fp){
  const f=x=>fmt(x,4),W=600,H=300;
  const N={r:[300,26],M:[150,118],Mb:[450,118],a:[75,214],b:[225,214],c:[375,214],d:[525,214]};
  const edge=(p,q,label,side)=>{const mx=(p[0]+q[0])/2+side*10,my=(p[1]+q[1])/2+4;return `<line class="tr-l" x1="${p[0]}" y1="${p[1]+16}" x2="${q[0]}" y2="${q[1]-16}"/><text class="tr-e" x="${mx}" y="${my}" text-anchor="${side<0?'end':'start'}">${label}</text>`;};
  const node=(p,t)=>`<circle class="tr-n" cx="${p[0]}" cy="${p[1]}" r="16"/><text class="tr-t" x="${p[0]}" y="${p[1]+5}" text-anchor="middle">${t}</text>`;
  const M_='M\u0304',T_='T\u0304';
  let s=edge(N.r,N.M,f(pM),-1)+edge(N.r,N.Mb,f(1-pM),1)+edge(N.M,N.a,f(se),-1)+edge(N.M,N.b,f(1-se),1)+edge(N.Mb,N.c,f(fp),-1)+edge(N.Mb,N.d,f(1-fp),1);
  s+=node(N.M,'M')+node(N.Mb,M_)+node(N.a,'T')+node(N.b,T_)+node(N.c,'T')+node(N.d,T_);
  const leaf=(p,lab,v)=>`<text class="tr-p" x="${p[0]}" y="258" text-anchor="middle">${f(v)}</text><text class="tr-s" x="${p[0]}" y="274" text-anchor="middle">${lab}</text>`;
  s+=leaf(N.a,'P(M∩T)',pM*se)+leaf(N.b,'P(M∩'+T_+')',pM*(1-se))+leaf(N.c,'P('+M_+'∩T)',(1-pM)*fp)+leaf(N.d,'P('+M_+'∩'+T_+')',(1-pM)*(1-fp));
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Arbre pondéré de probabilités">${s}</svg>`;
}
function initCh2(){
  const run=()=>{
    const pM=num($('#pM').value)/100,se=num($('#pSe').value)/100,fp=num($('#pFp').value)/100,o=$('#t2out');
    if([pM,se,fp].some(x=>isNaN(x)||x<0||x>1)){o.innerHTML='<p class="warnt">Entre des pourcentages entre 0 et 100.</p>';return;}
    $('#treeBox').innerHTML=treeSVG(pM,se,fp);
    const a=pM*se,c=(1-pM)*fp,pT=a+c,by=pT>0?a/pT:NaN,un=pM+pT-a,pr=pM*pT;
    const indep=Math.abs(a-pr)<1e-9;
    const f=x=>fmt(x,5);
    o.innerHTML=`<p class="st"><b>Compléments :</b> P(${ov('M')}) = 1 − ${f(pM)} = ${f(1-pM)}</p>
     <p class="st"><b>Intersection :</b> P(M ∩ T) = ${f(pM)} × ${f(se)} = <span class="res">${f(a)}</span></p>
     <p class="st"><b>Probabilités totales :</b> P(T) = ${f(a)} + ${f(1-pM)} × ${f(fp)} = ${f(a)} + ${f(c)} = <span class="res">${f(pT)}</span></p>
     <p class="st"><b>Bayes :</b> P${sub('T')}(M) = ${fr(f(a),f(pT))} ≈ <span class="res">${fmt(by,3)}</span></p>
     <p class="st"><b>Union :</b> P(M ∪ T) = ${f(pM)} + ${f(pT)} − ${f(a)} = <span class="res">${f(un)}</span></p>
     <p class="st"><b>Indépendance :</b> P(M) × P(T) = ${f(pr)} et P(M ∩ T) = ${f(a)} → ${indep?'<b>indépendants</b>':'<b>pas indépendants</b>'}</p>`;
  };
  $('#t2tree').addEventListener('input',run);run();
}

function initCh3(){
  let clue=null,answered=false;
  const box=$('#clueBox');
  function newClue(){
    clue=pick(CLUES);answered=false;
    box.innerHTML=`<p style="font-size:1.05rem">${clue[0]}</p><div class="chips" id="clueChips">${Object.entries(LAWKEYS).map(([k,v])=>`<button data-k="${k}">${v}</button>`).join('')}</div><div id="clueFb"></div>`;
  }
  box.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.next){newClue();return;}
    if(answered||!b.dataset.k)return;
    answered=true;
    const ok=b.dataset.k===clue[1];
    $$('#clueChips button').forEach(x=>{if(x.dataset.k===clue[1])x.classList.add('on');});
    $('#clueFb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Correct.':'Pas tout à fait.'}</b> C’est la loi ${LAWKEYS[clue[1]].toLowerCase()}. ${clue[2]}</div><p><button class="btn small" data-next="1">Autre énoncé</button></p>`;
  });
  newClue();

  const sel=$('#lawSel'),fields=$('#lawFields'),out=$('#lawOut');
  function build(){
    const L=LAWS[sel.value];
    fields.innerHTML=L.params.map(([k,l,d])=>`<label class="f">${l}<input data-p="${k}" inputmode="decimal" value="${d}"></label>`).join('')+`<label class="f">k<input id="lawK" inputmode="numeric" value="${L.k0}"></label>`;
    run();
  }
  function run(){
    const L=LAWS[sel.value],P={};
    $$('[data-p]',fields).forEach(i=>P[i.dataset.p]=num(i.value));
    const k=parseInt($('#lawK').value,10);
    const err=Object.values(P).some(isNaN)||isNaN(k)?'Remplis tous les champs avec des nombres.':L.ok(P);
    if(err){out.innerHTML=`<p class="warnt">${err}</p>`;return;}
    const pk=L.pmf(k,P),le=cdf(L,P,k),lt=cdf(L,P,k-1),ge=1-lt,gt=1-le;
    const [a,b]=L.cr(P);
    const data=[];for(let i=a;i<=b;i++)data.push({k:i,p:L.pmf(i,P)});
    const sn=sel.value==='hyper'?'W':sel.value==='geom'?'Z':sel.value==='binom'?'Y':'X';
    out.innerHTML=`<p class="st">${L.expr(k,P)} = <span class="res">${fmt(pk,5)}</span></p>
     <p class="st">P(${sn} ≤ ${k}) = <span class="res">${fmt(le,5)}</span> &nbsp; P(${sn} ≥ ${k}) = <span class="res">${fmt(ge,5)}</span></p>
     <p class="st">P(${sn} &gt; ${k}) = <span class="res">${fmt(gt,5)}</span></p>
     <p class="st">E(${sn}) = <span class="res">${fmt(L.E(P),5)}</span> &nbsp; V(${sn}) = <span class="res">${fmt(L.V(P),5)}</span></p>${bars(data,x=>x===k,'Loi de probabilité, valeur k en rouge')}`;
  }
  sel.addEventListener('change',build);fields.addEventListener('input',run);build();
}

   ${qa('1.3','Espérance E(X).',`${eq('E(X) = (−1 × 0,1) + (0 × 0,4) + (1 × 0,3) + (2 × 0,2) = −0,1 + 0 + 0,3 + 0,4 = 0,6')}`)}
   ${qa('1.4','Variance V(X) en détaillant.',`${eq('E(X'+sup(2)+') = (1 × 0,1) + (0 × 0,4) + (1 × 0,3) + (4 × 0,2) = 1,2')}${eq('V(X) = 1,2 − (0,6)'+sup(2)+' = 1,2 − 0,36 = 0,84')}`)}
   <p><b>Partie 2.</b> f(t) = k(1 − t) sur [0 ; 1], 0 sinon.</p>
   ${qa('2.1','Valeur de k pour que f soit une densité.',`${eq(integ(0,1)+' k(1 − t) dt = k [ t − '+fr('t'+sup(2),2)+' ]'+lim(0,1)+' = k(1 − '+fr(1,2)+') = '+fr('k',2))}<p>On veut k/2 = 1, donc <b>k = 2</b>.</p>`)}
   ${qa('2.2','Avec k = 2, calculer P(Y &gt; 0,5).',`${eq('P(Y &gt; 0,5) = '+integ('0,5',1)+' 2(1 − t) dt = [ 2t − t'+sup(2)+' ]'+lim('0,5',1)+' = (2 − 1) − (1 − 0,25) = 0,25')}`)}
   ${qa('2.3','Espérance E(Y).',`${eq('E(Y) = '+integ(0,1)+' t × 2(1 − t) dt = '+integ(0,1)+' (2t − 2t'+sup(2)+') dt = [ t'+sup(2)+' − '+fr('2t'+sup(3),3)+' ]'+lim(0,1)+' = 1 − '+fr(2,3)+' = '+fr(1,3))}`)}
   ${qa('2.4','(Bonus) Démontrer V(Y) = 1/18.',`${eq('E(Y'+sup(2)+') = '+integ(0,1)+' (2t'+sup(2)+' − 2t'+sup(3)+') dt = [ '+fr('2t'+sup(3),3)+' − '+fr('2t'+sup(4),4)+' ]'+lim(0,1)+' = '+fr(2,3)+' − '+fr(1,2)+' = '+fr(1,6))}${eq('V(Y) = '+fr(1,6)+' − ('+fr(1,3)+')'+sup(2)+' = '+fr(3,18)+' − '+fr(2,18)+' = '+fr(1,18))}`)}
   <p><b>Partie 3.</b> U suit U([−3 ; 4]).</p>
   ${qa('3.1','Densité f(x).',`<p>b − a = 4 − (−3) = 7.</p>${eq('f(x) = '+fr(1,7)+' si x ∈ [−3 ; 4], 0 sinon')}`)}
   ${qa('3.2','Schéma de la densité.',`<p>Un « créneau » : une ligne horizontale de hauteur 1/7 entre x = −3 et x = 4, et 0 ailleurs. Tu peux le voir tracé dans l’outil ci-dessus.</p>`)}
   ${qa('3.3','P(U &lt; 2), P(U &gt; 0), P(−2 &lt; U &lt; 1) en fractions exactes.',`${eq('P(U &lt; 2) = '+fr('2 − (−3)',7)+' = '+fr(5,7))}${eq('P(U &gt; 0) = '+fr('4 − 0',7)+' = '+fr(4,7))}${eq('P(−2 &lt; U &lt; 1) = '+fr('1 − (−2)',7)+' = '+fr(3,7))}`)}
  </div>
  ${chapterFooter('ch4')}`;
}
function initCh4(){
  /* tableau */
  let cols=[[-1,0.1],[0,0.4],[1,0.3],[2,0.2]];
  const box=$('#tabCols');
  const draw=()=>{box.innerHTML=cols.map((c,i)=>`<div class="col"><span>x${i+1}</span><input data-x="${i}" inputmode="decimal" value="${fmt(c[0],4)}"><span>P(X = x${i+1})</span><input data-pp="${i}" inputmode="decimal" value="${fmt(c[1],4)}"></div>`).join('');};
  const runTab=()=>{
    const o=$('#tabOut');
    const xs=$$('[data-x]',box).map(i=>num(i.value)),ps=$$('[data-pp]',box).map(i=>num(i.value));
    if(xs.some(isNaN)||ps.some(isNaN)){o.innerHTML='<p class="warnt">Remplis toutes les cases avec des nombres.</p>';return;}
    const s=ps.reduce((a,b)=>a+b,0);
    const valid=ps.every(p=>p>=0)&&Math.abs(s-1)<1e-9;
    let h=`<p class="st"><b>Validité :</b> ${ps.map(p=>fmt(p,4)).join(' + ')} = ${fmt(s,4)} → ${valid?'<b>loi valide</b>':'<span class="warnt">loi non valide (somme ≠ 1 ou proba négative)</span>'}</p>`;
    if(!valid){o.innerHTML=h;return;}
    const E=xs.reduce((a,x,i)=>a+x*ps[i],0),E2=xs.reduce((a,x,i)=>a+x*x*ps[i],0),V=E2-E*E;
    h+=`<p class="st"><b>E(X)</b> = ${xs.map((x,i)=>`(${fmt(x,4)} × ${fmt(ps[i],4)})`).join(' + ')} = <span class="res">${fmt(E,5)}</span></p>`;
    h+=`<p class="st"><b>E(X²)</b> = ${xs.map((x,i)=>`(${fmt(x*x,4)} × ${fmt(ps[i],4)})`).join(' + ')} = ${fmt(E2,5)}</p>`;
    h+=`<p class="st"><b>V(X)</b> = E(X²) − E(X)² = ${fmt(E2,5)} − ${fmt(E*E,5)} = <span class="res">${fmt(V,5)}</span> &nbsp; σ = ${fmt(Math.sqrt(Math.max(V,0)),4)}</p>`;
    const a=num($('#tabA').value),op=$('#tabOp').value;
    if(!isNaN(a)){
      const test={ge:x=>x>=a,gt:x=>x>a,le:x=>x<=a,lt:x=>x<a}[op];
      const keep=xs.map((x,i)=>test(x)?i:-1).filter(i=>i>=0);
      const sym={ge:'≥',gt:'&gt;',le:'≤',lt:'&lt;'}[op];
      h+=`<p class="st"><b>P(X ${sym} ${fmt(a,4)})</b> = ${keep.length?keep.map(i=>fmt(ps[i],4)).join(' + '):'0'} = <span class="res">${fmt(keep.reduce((s2,i)=>s2+ps[i],0),5)}</span> <span style="color:var(--muted)">(valeurs retenues : ${keep.length?keep.map(i=>fmt(xs[i],4)).join(' ; '):'aucune'})</span></p>`;
    }
    o.innerHTML=h;
  };
  draw();
  $('#t4tab').addEventListener('input',runTab);
  $('#tabOp').addEventListener('change',runTab);
  $('#addCol').addEventListener('click',()=>{cols=$$('[data-x]',box).map((i,k)=>[num(i.value),num($$('[data-pp]',box)[k].value)]);if(cols.length<8){cols.push([Math.max(...cols.map(c=>c[0]))+1,0]);draw();runTab();}});
  $('#delCol').addEventListener('click',()=>{cols=$$('[data-x]',box).map((i,k)=>[num(i.value),num($$('[data-pp]',box)[k].value)]);if(cols.length>2){cols.pop();draw();runTab();}});
  runTab();

  /* densité */
  const runD=()=>{
    const k=num($('#dk').value),a=num($('#da').value),o=$('#densOut');
    if(isNaN(k)||isNaN(a)||a<0||a>1){o.innerHTML='<p class="warnt">k : un nombre ; a doit être compris entre 0 et 1.</p>';return;}
    const aire=k/2,valid=Math.abs(aire-1)<1e-9&&k>=0;
    const Pa=k*(1-a)*(1-a)/2,E=k/6,E2=k/12,V=E2-E*E;
    let h=`<p class="st"><b>Aire totale</b> = ${integ(0,1)} k(1 − t) dt = k/2 = ${fmt(aire,4)} → ${valid?'<b>densité valide</b>':'<span class="warnt">pas une densité : il faut k = 2</span>'}</p>`;
    h+=`<p class="st"><b>P(Y &gt; ${fmt(a,3)})</b> = ${integ(fmt(a,3),1)} k(1 − t) dt = k(1 − a)²/2 = <span class="res">${fmt(Pa,5)}</span></p>`;
    h+=`<p class="st"><b>E(Y)</b> = ${integ(0,1)} t·k(1 − t) dt = k(½ − ⅓) = k/6 = <span class="res">${fmt(E,5)}</span></p>`;
    h+=`<p class="st"><b>E(Y²)</b> = k(⅓ − ¼) = k/12 = ${fmt(E2,5)} &nbsp; <b>V(Y)</b> = ${fmt(E2,5)} − ${fmt(E*E,5)} = <span class="res">${fmt(V,5)}</span></p>`;
    if(valid)h+=`<p class="st" style="color:var(--muted)">Avec k = 2 : V(Y) = 1/6 − 1/9 = 1/18 ≈ 0,0556.</p>`;
    h+=plot({xmin:-0.3,xmax:1.3,ymax:Math.max(k,1)*1.2,f:t=>(t>=0&&t<=1)?k*(1-t):0,jumps:[0,1],shade:[a,1],ticks:[[0,'0'],[0.5,'0,5'],[1,'1']],yticks:[[Math.max(k,0),fmt(k,2)]],label:'Densité de Y avec l’aire P(Y>a) colorée'});
    o.innerHTML=h;
  };
  $('#t4dens').addEventListener('input',runD);runD();

  /* uniforme */
  const runU=()=>{
    const a=num($('#ua').value),b=num($('#ub').value),c=num($('#uc').value),d=num($('#ud').value),o=$('#uniOut');
    if([a,b,c,d].some(isNaN)||b<=a||d<c){o.innerHTML='<p class="warnt">Il faut a &lt; b et c ≤ d.</p>';return;}
    const lo=Math.max(a,c),hi=Math.min(b,d),pr=Math.max(0,hi-lo)/(b-a);
    const ints=[a,b,c,d].every(Number.isInteger);
    const FP=ints?fracHTML(Math.max(0,hi-lo),b-a):fmt(pr,5);
    const Eh=ints?fracHTML(a+b,2):fmt((a+b)/2,5);
    const Vh=ints?fracHTML((b-a)*(b-a),12):fmt((b-a)*(b-a)/12,5);
    let h=`<p class="st"><b>Densité :</b> f(x) = ${ints?fr(1,b-a):fmt(1/(b-a),5)} sur [${fmt(a,3)} ; ${fmt(b,3)}]</p>
     <p class="st"><b>P(${fmt(c,3)} &lt; U &lt; ${fmt(d,3)})</b> = ${fr(fmt(hi-lo,3),fmt(b-a,3))} = <span class="res">${FP}</span> ${ints?`≈ ${fmt(pr,4)}`:''}</p>
     <p class="st">E(U) = ${Eh} &nbsp; V(U) = ${Vh}</p>`;
    h+=plot({xmin:a-1,xmax:b+1,ymax:1.3/(b-a),f:x=>(x>=a&&x<=b)?1/(b-a):0,jumps:[a,b],shade:[c,d],ticks:[[a,fmt(a,2)],[b,fmt(b,2)],[0,'0']],label:'Densité uniforme avec la zone demandée colorée'});
    o.innerHTML=h;
  };
  $('#t4uni').addEventListener('input',runU);runU();
}

/* ---------- CH5 ---------- */
function renderCh5(){
  const tbl=Object.entries(TABLE).map(([z,p])=>`<tr><td>Φ(${fmt(+z,2)})</td><td>${p.toFixed(4).replace('.',',')}</td></tr>`).join('');
  return `<h2>5. Loi normale</h2>
  <p class="lead">Une seule astuce : tout ramener à la loi normale centrée réduite N(0, 1), dont on lit la table.</p>
  <div class="card"><h3>Centrage et réduction</h3>
   <p>X suit N(μ ; σ²) : μ est la moyenne, σ l’<b>écart-type</b>. Dans N(150 ; 15²), σ = 15 et non 225.</p>
   ${eq('Z = '+fr('X − μ','σ')+' suit N(0 ; 1)')}
   <p>Φ(z) = P(Z ≤ z) est la fonction de répartition, donnée par la table.</p></div>
  <div class="card"><h3>Les 5 cas</h3>
   ${eq('P(X &lt; a) = Φ('+fr('a − μ','σ')+')')}
   ${eq('P(X &gt; a) = 1 − Φ('+fr('a − μ','σ')+')')}
   ${eq('P(a ≤ X ≤ b) = Φ('+fr('b − μ','σ')+') − Φ('+fr('a − μ','σ')+')')}
   ${eq('Φ(−z) = 1 − Φ(z)')}
   ${eq('P(−z ≤ Z ≤ z) = 2Φ(z) − 1')}
   ${callout('La table ne donne que z ≥ 0','<p>Pour un z négatif, on utilise la symétrie : Φ(−z) = 1 − Φ(z).</p>','warn')}</div>
  <div class="card"><h3>Probabilité inverse</h3>
   <p>On connaît la probabilité, on cherche le seuil m : P(X ≤ m) = p.</p>
   <ol><li>Traduire : X ≤ m ⇔ Z ≤ (m − μ)/σ.</li><li>Lire dans la table t tel que Φ(t) = p.</li><li>Isoler : m = μ + σ t.</li></ol></div>
  <div class="card"><h3>Table fournie dans le sujet</h3><div class="scroll"><table class="tbl" style="max-width:320px"><tr><th>z</th><th>Φ(z)</th></tr>${tbl}</table></div></div>

  <div class="card tool" id="t5calc"><h3>Calculer une probabilité</h3>
   <div class="fields"><label class="f">μ<input id="nmu" inputmode="decimal" value="150"></label><label class="f">σ<input id="nsig" inputmode="decimal" value="15"></label>
   <label class="f">Type<select id="nmode"><option value="lt">P(X &lt; a)</option><option value="gt">P(X &gt; a)</option><option value="bt" selected>P(a ≤ X ≤ b)</option></select></label>
   <label class="f">a<input id="na" inputmode="decimal" value="135"></label><label class="f" id="nbwrap">b<input id="nb" inputmode="decimal" value="165"></label></div>
   <div class="out" id="nout"></div></div>
  <div class="card tool" id="t5inv"><h3>Probabilité inverse : trouver m</h3>
   <div class="fields"><label class="f">μ<input id="imu" inputmode="decimal" value="150"></label><label class="f">σ<input id="isig" inputmode="decimal" value="15"></label><label class="f">p = P(X ≤ m)<input id="ip" inputmode="decimal" value="0,90"></label></div>
   <div class="out" id="iout"></div></div>

  <div class="card"><h3>Questions du sujet (Exercice 5)</h3>
   <p style="margin-top:0">Poids X des pommes : N(150 ; 15²).</p>
   ${qa('1','Formule de centrage-réduction et loi de Z.',`${eq('Z = '+fr('X − μ','σ')+' = '+fr('X − 150',15))}<p>Z suit la loi normale centrée réduite N(0 ; 1) : moyenne 0, écart-type 1.</p>`)}
   ${qa('2a','P(X &lt; 180).',`${eq('X &lt; 180 ⇔ '+fr('X − 150',15)+' &lt; '+fr(30,15)+' ⇔ Z &lt; 2')}${eq('P(Z &lt; 2) = Φ(2) = 0,9772')}`)}
   ${qa('2b','Poids entre 135 g et 165 g.',`${eq('135 ≤ X ≤ 165 ⇔ −1 ≤ Z ≤ 1')}${eq('P(−1 ≤ Z ≤ 1) = Φ(1) − Φ(−1) = 2Φ(1) − 1 = 2 × 0,8413 − 1 = 0,6826')}`)}
   ${qa('2c','Pommes jetées au-dessus de 180 g : quel pourcentage ?',`${eq('P(X &gt; 180) = 1 − P(X &lt; 180) = 1 − 0,9772 = 0,0228')}<p>Soit <b>2,28 %</b> de la récolte.</p>`)}
   ${qa('3a','Traduire X ≤ m en inégalité sur Z.',`${eq('X ≤ m ⇔ '+fr('X − 150',15)+' ≤ '+fr('m − 150',15)+' ⇔ Z ≤ '+fr('m − 150',15))}`)}
   ${qa('3b','Trouver t tel que Φ(t) = 0,90.',`<p>Dans la table : Φ(1,28) ≈ 0,9000, donc <b>t = 1,28</b>.</p>`)}
   ${qa('3c','En déduire m.',`${eq(fr('m − 150',15)+' = 1,28 ⇔ m − 150 = 15 × 1,28 = 19,2 ⇔ m = 169,2 g')}`)}
  </div>
  ${chapterFooter('ch5')}`;
}
function initCh5(){
  const lookup=z=>{const key=Math.abs(z).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');const t=TABLE[parseFloat(key)];return t;};
  const phiLine=(z)=>{
    const v=Phi(z);
    if(z>=0){const t=lookup(z);return `Φ(${fmt(z,3)}) ≈ ${fmt(v,4)}${t!==undefined?` <span style="color:var(--muted)">(table : ${t.toFixed(4).replace('.',',')})</span>`:''}`;}
    const t=lookup(z);
    return `Φ(${fmt(z,3)}) = 1 − Φ(${fmt(-z,3)}) ≈ 1 − ${fmt(Phi(-z),4)} = ${fmt(v,4)}${t!==undefined?` <span style="color:var(--muted)">(table : 1 − ${t.toFixed(4).replace('.',',')})</span>`:''}`;
  };
  const run=()=>{
    const mu=num($('#nmu').value),s=num($('#nsig').value),a=num($('#na').value),b=num($('#nb').value),mode=$('#nmode').value,o=$('#nout');
    $('#nbwrap').style.display=mode==='bt'?'flex':'none';
    if([mu,s,a].some(isNaN)||s<=0||(mode==='bt'&&(isNaN(b)||b<a))){o.innerHTML='<p class="warnt">Vérifie μ, σ &gt; 0, et a ≤ b.</p>';return;}
    const za=(a-mu)/s,zb=(b-mu)/s;
    let h=`<p class="st">Centrage-réduction : z<sub>a</sub> = ${fr(`${fmt(a,3)} − ${fmt(mu,3)}`,fmt(s,3))} = <span class="res">${fmt(za,4)}</span></p>`;
    if(mode==='bt')h+=`<p class="st">z<sub>b</sub> = ${fr(`${fmt(b,3)} − ${fmt(mu,3)}`,fmt(s,3))} = <span class="res">${fmt(zb,4)}</span></p>`;
    h+=`<p class="st">${phiLine(za)}</p>`;
    let P,lo,hi;
    if(mode==='lt'){P=Phi(za);h+=`<p class="st"><b>P(X &lt; ${fmt(a,3)})</b> = Φ(z<sub>a</sub>) = <span class="res">${fmt(P,4)}</span></p>`;lo=mu-4*s;hi=a;}
    else if(mode==='gt'){P=1-Phi(za);h+=`<p class="st"><b>P(X &gt; ${fmt(a,3)})</b> = 1 − Φ(z<sub>a</sub>) = <span class="res">${fmt(P,4)}</span></p>`;lo=a;hi=mu+4*s;}
    else{P=Phi(zb)-Phi(za);h+=`<p class="st">${phiLine(zb)}</p><p class="st"><b>P(${fmt(a,3)} ≤ X ≤ ${fmt(b,3)})</b> = Φ(z<sub>b</sub>) − Φ(z<sub>a</sub>) = <span class="res">${fmt(P,4)}</span></p>`;lo=a;hi=b;}
    h+=`<p class="st" style="color:var(--muted)">Soit ${fmt(P*100,2)} %. Valeurs exactes calculées ; avec la table du sujet, tu arrondis à 4 décimales.</p>`;
    const pk=1/(s*Math.sqrt(2*Math.PI));
    h+=plot({xmin:mu-4*s,xmax:mu+4*s,ymax:pk*1.15,f:x=>pk*Math.exp(-((x-mu)*(x-mu))/(2*s*s)),shade:[lo,hi],ticks:[-3,-2,-1,0,1,2,3].map(j=>[mu+j*s,fmt(mu+j*s,3)]),label:'Courbe en cloche de X avec l’aire demandée colorée'});
    o.innerHTML=h;
  };
  $('#t5calc').addEventListener('input',run);$('#nmode').addEventListener('change',run);run();
  const runI=()=>{
    const mu=num($('#imu').value),s=num($('#isig').value),p=num($('#ip').value),o=$('#iout');
    if([mu,s,p].some(isNaN)||s<=0||p<=0||p>=1){o.innerHTML='<p class="warnt">Il faut σ &gt; 0 et 0 &lt; p &lt; 1.</p>';return;}
    const t=invPhi(p),tr=Math.round(t*100)/100,m=mu+s*tr;
    let h=`<p class="st"><b>1.</b> X ≤ m ⇔ Z ≤ ${fr('m − '+fmt(mu,3),fmt(s,3))}</p>`;
    h+=`<p class="st"><b>2.</b> On cherche t tel que Φ(t) = ${fmt(p,4)} : <span class="res">t ≈ ${fmt(tr,2)}</span>${p<0.5?` <span style="color:var(--muted)">(p &lt; 0,5 : t = −t′ avec Φ(t′) = ${fmt(1-p,4)})</span>`:''}</p>`;
    h+=`<p class="st"><b>3.</b> m = μ + σ × t = ${fmt(mu,3)} + ${fmt(s,3)} × ${fmt(tr,2)} = <span class="res">${fmt(m,3)}</span></p>`;
    o.innerHTML=h;
  };
  $('#t5inv').addEventListener('input',runI);runI();
}

/* ---------- CH6 ---------- */
function renderCh6(){
  return `<h2>6. Loi exponentielle</h2>
  <p class="lead">La durée de vie d’un composant qui ne vieillit pas. Quatre formules suffisent.</p>
  <div class="card"><h3>À savoir</h3>
   <p>T suit une loi exponentielle de paramètre λ &gt; 0.</p>
   ${eq('f(t) = λ e'+sup('−λt')+' pour t ≥ 0')}
   ${eq('F(t) = P(T ≤ t) = 1 − e'+sup('−λt')+' ; P(T &gt; t) = e'+sup('−λt'))}
   ${eq('E(T) = '+fr(1,'λ')+' ; P(a ≤ T ≤ b) = F(b) − F(a) = e'+sup('−λa')+' − e'+sup('−λb'))}
   <p style="color:var(--muted);font-size:.92rem;margin:0">Bonus : V(T) = 1/λ².</p>
   ${callout('Absence de mémoire (loi « sans vieillissement »)','<p>Le temps déjà passé n’influence pas la suite. Pour tous s, t ≥ 0 :</p>'+eq('P'+sub('T ≥ s')+'(T ≥ s + t) = P(T ≥ t) = e'+sup('−λt'))+'<p>Une pièce qui a fonctionné 5 ans a la même probabilité de tenir 3 ans de plus qu’une pièce neuve.</p>')}
   ${callout('Interprétation de λ','<p>E(T) = 8 ans donne λ = 1/8 = 0,125 par an.</p>','good')}</div>
  <div class="card tool" id="t6"><h3>Calculateur exponentielle</h3>
   <div class="fields"><label class="f">λ<input id="el" inputmode="decimal" value="0,125"></label><label class="f">ou E(T)<input id="em" inputmode="decimal" value="8"></label></div>
   <div class="fields"><label class="f">t₁ : P(T ≤ t₁)<input id="et1" inputmode="decimal" value="4"></label><label class="f">t₂ : P(T &gt; t₂)<input id="et2" inputmode="decimal" value="10"></label><label class="f">a<input id="ea" inputmode="decimal" value="4"></label><label class="f">b<input id="eb" inputmode="decimal" value="8"></label></div>
   <div class="fields"><label class="f">s (âge déjà atteint)<input id="es" inputmode="decimal" value="5"></label><label class="f">t (durée en plus)<input id="et" inputmode="decimal" value="3"></label></div>
   <div class="out" id="eout"></div></div>

  <div class="card"><h3>Questions du sujet (Exercice 6)</h3>
   <p style="margin-top:0">Durée de vie T d’un composant, espérance annoncée : 8 ans.</p>
   ${qa('1','Valeur exacte de λ.',`${eq('E(T) = '+fr(1,'λ')+' = 8 ⇒ λ = '+fr(1,8)+' = 0,125')}`)}

let quiz=null;
function parseAns(s){s=String(s).trim();if(s.indexOf('/')>0){const [a,b]=s.split('/');return num(a)/num(b);}return num(s);}
function renderQuiz(){return `<h2>Quiz</h2><div id="quizBox"></div>`;}
function quizHome(){
  const box=$('#quizBox');
  const chips=['all',1,2,3,4,5,6].map(c=>`<button data-sc="${c}" class="${String(quizScope)===String(c)?'on':''}">${c==='all'?'Tout le programme':'Chapitre '+c}</button>`).join('');
  const bests=Object.entries(state.best).sort().map(([k,v])=>`<tr><td>${k==='all'?'Tout le programme':'Chapitre '+k}</td><td>${v} %</td></tr>`).join('');
  box.innerHTML=`<p class="lead">Les valeurs sont tirées au hasard à chaque question. Réponds sur papier si besoin, puis saisis le résultat.</p>
  <div class="card"><h3>Thème</h3><div class="chips" id="scChips">${chips}</div>
  <h3>Nombre de questions</h3><div class="chips" id="nChips"><button data-n="10" class="on">10</button><button data-n="20">20</button></div>
  <button class="btn" data-q="start">Commencer</button></div>
  ${bests?`<div class="card"><h3>Meilleurs scores</h3><table class="tbl"><tr><th>Thème</th><th>Score</th></tr>${bests}</table></div>`:''}`;
}
function quizStart(n){
  const pool=GEN.filter(g=>quizScope==='all'||g.__ch===+quizScope);
  let list=[];
  while(list.length<n)list=list.concat(shuffle(pool));
  list=list.slice(0,n);
  quiz={scope:quizScope,qs:list.map(g=>g()),i:0,score:0,answered:false,wrong:[],byCh:{}};
  quizDraw();
}
function quizDraw(){
  const box=$('#quizBox');
  if(quiz.i>=quiz.qs.length)return quizEnd();
  const q=quiz.qs[quiz.i];
  let h=`<div class="prog"><i style="width:${Math.round(quiz.i/quiz.qs.length*100)}%"></i></div><p style="color:var(--muted);font:500 .9rem var(--sans)">Question ${quiz.i+1} sur ${quiz.qs.length} · chapitre ${q.ch} · score ${quiz.score}</p>
  <div class="card qbox"><p style="margin-top:0">${q.q}</p>`;
  if(q.type==='mcq')h+=q.choices.map((c,i)=>`<button class="choice" data-c="${i}">${c}</button>`).join('');
  else h+=`<div class="fields" style="grid-template-columns:1fr auto"><input id="qin" inputmode="decimal" placeholder="Ta réponse (ex : 0,563 ou 5/7)" autocomplete="off"><button class="btn" data-q="check">Valider</button></div>`;
  h+=`<div id="qfb"></div></div>`;
  box.innerHTML=h;
  const inp=$('#qin');if(inp){inp.focus({preventScroll:true});inp.addEventListener('keydown',e=>{if(e.key==='Enter')qCheck();});}
  quiz.answered=false;
}
function qFinish(ok,extra){
  const q=quiz.qs[quiz.i];
  quiz.answered=true;
  quiz.byCh[q.ch]=quiz.byCh[q.ch]||[0,0];quiz.byCh[q.ch][1]++;
  if(ok){quiz.score++;quiz.byCh[q.ch][0]++;}else quiz.wrong.push(q);
  $('#qfb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Bonne réponse.':'Pas tout à fait.'}</b> ${extra||''}<p style="margin:6px 0 0">${q.expl}</p></div><p><button class="btn" data-q="next">${quiz.i+1>=quiz.qs.length?'Voir le résultat':'Question suivante'}</button></p>`;
}
function qCheck(){
  if(quiz.answered)return;
  const q=quiz.qs[quiz.i],v=parseAns($('#qin').value);
  if(isNaN(v)){$('#qfb').innerHTML='<p class="warnt">Entre un nombre (ou une fraction comme 5/7).</p>';return;}
  const ok=Math.abs(v-q.ans)<=q.tol;
  $('#qin').disabled=true;
  qFinish(ok,ok?'':`Réponse attendue : <b>${q.show}</b>.`);
}
function quizEnd(){
  const n=quiz.qs.length,pct=Math.round(quiz.score/n*100);
  const key=quiz.scope==='all'?'all':String(quiz.scope);
  if(state.best[key]===undefined||pct>state.best[key]){state.best[key]=pct;save();}
  const rows=Object.entries(quiz.byCh).sort().map(([c,v])=>`<tr><td>Chapitre ${c}</td><td>${v[0]} / ${v[1]}</td></tr>`).join('');
  $('#quizBox').innerHTML=`<div class="card"><div class="big">${quiz.score} / ${n}</div><p>${pct>=80?'Solide. Continue sur les chapitres où tu as perdu des points.':pct>=50?'Bien parti. Relis les corrigés des erreurs ci-dessous.':'Reprends le cours des chapitres concernés avant de refaire un quiz.'}</p>
  <table class="tbl"><tr><th>Chapitre</th><th>Résultat</th></tr>${rows}</table>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn" data-q="again">Rejouer</button><button class="btn ghost" data-q="home">Changer de thème</button></div></div>
  ${quiz.wrong.length?`<div class="card"><h3>À revoir</h3>${quiz.wrong.map(q=>`<div class="qa"><div class="qb"><div>${q.q}</div><div class="solbody" style="margin-top:6px"><b>${q.type==='num'?q.show:q.choices[q.correct]}</b><br>${q.expl}</div></div></div>`).join('')}</div>`:''}`;
}
function initQuiz(){
  const box=$('#quizBox');
  if(quiz&&quiz.i<quiz.qs.length&&quiz.scope===quizScope){quizDraw();}else quizHome();
  let nQ=10;
  box.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.sc){quizScope=t.dataset.sc;$$('#scChips button').forEach(x=>x.classList.toggle('on',x===t));return;}
    if(t.dataset.n){nQ=+t.dataset.n;$$('#nChips button').forEach(x=>x.classList.toggle('on',x===t));return;}
    if(t.dataset.c!==undefined){
      if(quiz.answered)return;
      const q=quiz.qs[quiz.i],i=+t.dataset.c;
      $$('.choice',box).forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('right');else if(k===i)b.classList.add('wrong');});
      qFinish(i===q.correct,'');return;
    }
    switch(t.dataset.q){
      case 'start':quizStart(nQ);break;
      case 'check':qCheck();break;
      case 'next':quiz.i++;quizDraw();break;
      case 'again':quizStart(quiz.qs.length);break;
      case 'home':quiz=null;quizHome();break;
    }
  });
}

  <div class="card"><h3>4. Variables générales</h3>${line('E(X) = Σ x'+sub('i')+'P(x'+sub('i')+') · V(X) = E(X²) − (E(X))²')}${line('Densité : f ≥ 0 et ∫ f = 1 · P(Y &gt; a) = ∫'+sub('a')+sup('+∞')+' f · E(Y) = ∫ t f(t) dt')}${line('Uniforme [a ; b] : f = 1/(b − a) · P(c &lt; U &lt; d) = (d − c)/(b − a)')}</div>
  <div class="card"><h3>5. Loi normale</h3>${line('Z = (X − μ)/σ ~ N(0 ; 1) · P(X &lt; a) = Φ((a − μ)/σ) · P(X &gt; a) = 1 − Φ(·)')}${line('Φ(−z) = 1 − Φ(z) · P(−z ≤ Z ≤ z) = 2Φ(z) − 1 · Inverse : m = μ + σ t')}</div>
  <div class="card"><h3>6. Loi exponentielle</h3>${line('f(t) = λe'+sup('−λt')+' · F(t) = 1 − e'+sup('−λt')+' · P(T &gt; t) = e'+sup('−λt'))}${line('E(T) = 1/λ · P(a ≤ T ≤ b) = e'+sup('−λa')+' − e'+sup('−λb'))}${line('Sans mémoire : P'+sub('T ≥ s')+'(T ≥ s + t) = P(T ≥ t)')}</div>
  <div class="card"><h3>Pièges classiques</h3><ol>
   <li>Loi discrète : lire attentivement strict ou large (P(−1 &lt; X ≤ 1) exclut −1).</li>
   <li>N(150 ; 15²) : l’écart-type est 15, pas 225.</li>
   <li>La table ne contient que des z positifs : utiliser Φ(−z) = 1 − Φ(z).</li>
   <li>« Au moins un » : 1 − P(aucun).</li>
   <li>P<sub>T</sub>(M) et P<sub>M</sub>(T) sont deux choses différentes.</li>
   <li>Union : ne pas oublier de soustraire l’intersection.</li>
   <li>Géométrique : Z compte les essais succès compris, donc P(Z &gt; 3) = (5/6)³.</li>
   <li>Densité : on vérifie aire = 1 ; et P(Y = a) = 0.</li>
   <li>Écrire la formule littérale avant l’application numérique, et justifier chaque réponse.</li></ol></div>`;
}


/* ---------- SUJETS BLANCS ---------- */
const EXOS=[['Dénombrement',6,'ch1'],['Probabilités élémentaires',6,'ch2'],['Lois discrètes',8,'ch3'],['Variables générales',9,'ch4'],['Loi normale',5,'ch5'],['Loi exponentielle',4,'ch6']];
const SUJETS=[
 {n:1,ctx:'Anti-spam, standard téléphonique, boîte d’ampoules, trajets domicile–travail, batterie.',vals:['Poisson λ = 8, binomiale B(40 ; 0,05), géométrique p = 1/4, hypergéométrique H(20 ; 3 ; 4)','Densité k(3 − t) sur [0 ; 3], loi uniforme sur [−2 ; 6]','Loi normale N(40 ; 8²), seuil à 95 %','Loi exponentielle d’espérance 5 ans']},
 {n:2,ctx:'Ateliers de production, point relais, urne, usinage, temps d’attente à un guichet.',vals:['Poisson λ = 4, binomiale B(10 ; 0,1), géométrique p = 1/5, hypergéométrique H(12 ; 4 ; 5)','Densité k(2 − t) sur [0 ; 2], loi uniforme sur [−4 ; 6]','Loi normale N(25 ; 0,4²), seuil à 97,5 %','Loi exponentielle d’espérance 20 minutes']}
];
function renderSujets(){
  const cards=SUJETS.map(S=>`<div class="card sjcard" id="sj${S.n}"><h3>Sujet blanc n°${S.n}</h3><p class="sub">${S.ctx}</p>
   <p style="margin:.3em 0"><b>Valeurs de ce sujet :</b></p><ul>${S.vals.map(t=>`<li>${t}</li>`).join('')}</ul>
   <div class="dlrow"><button class="btn" data-dl="sujet${S.n}-enonce" data-name="Sujet-blanc-${S.n}-enonce.pdf">Énoncé (PDF)</button><button class="btn ghost" data-dl="sujet${S.n}-corrige" data-name="Sujet-blanc-${S.n}-corrige.pdf">Corrigé détaillé (PDF)</button></div>
   <h3 style="margin-top:14px">Mes points</h3><p class="sub" style="margin-bottom:0">Corrige-toi au stylo rouge, puis note ici tes points par exercice.</p>
   <div class="sjgrid">${EXOS.map((e,i)=>`<label class="f">Ex. ${i+1} (sur ${e[1]})<input data-sc="${S.n}-${i}" inputmode="decimal" value="${state.scores[S.n+'-'+i]!==undefined?state.scores[S.n+'-'+i]:''}"></label>`).join('')}</div>
   <div class="out" id="scout${S.n}"></div></div>`).join('');
  return `<h2>Sujets blancs supplémentaires</h2>
  <p class="lead">Deux sujets complets calqués sur les exercices des chapitres : mêmes six exercices, mêmes questions, mêmes méthodes, même barème (38 points). Seuls les contextes et les valeurs changent.</p>
  <div class="card"><h3>Comment les utiliser</h3><ol class="steps">
   <li><div>Fais le sujet en conditions réelles : 2 h, une copie double, sans le corrigé, avec l’aide au calcul de la dernière page.</div></li>
   <li><div>Corrige-toi avec le PDF du corrigé, en notant d’où vient chaque point perdu.</div></li>
   <li><div>Saisis tes points ci-dessous : le site te dit quels chapitres retravailler.</div></li></ol>
   <div class="dlmsg" id="dlmsg" role="status" aria-live="polite"></div></div>
  ${cards}`;
}
function sjUpdate(n){
  const o=$('#scout'+n);let tot=0,ans=0,weak=[];
  EXOS.forEach((e,i)=>{
    const raw=state.scores[n+'-'+i];
    if(raw===undefined||raw===''||isNaN(num(raw)))return;
    const v=Math.min(Math.max(num(raw),0),e[1]);ans++;tot+=v;
    if(v/e[1]<0.6)weak.push([i,e]);
  });
  if(!ans){o.innerHTML='<p style="margin:0;color:var(--muted)">Aucune note saisie pour le moment.</p>';return;}
  const done=EXOS.filter((e,i)=>state.scores[n+'-'+i]!==undefined&&state.scores[n+'-'+i]!=='').reduce((a,e)=>a+e[1],0);
  o.innerHTML=`<p class="st"><b>Total :</b> <span class="res">${fmt(tot,2)} / ${done}</span> ${done<38?'<span style="color:var(--muted)">(exercices saisis seulement)</span>':`soit ${fmt(tot/38*20,1)} / 20`}</p>`+
   (weak.length?`<p class="st"><b>À retravailler :</b> ${weak.map(([i,e])=>`<a href="#${e[2]}">${i+1}. ${e[0]}</a>`).join(' · ')}</p>`:`<p class="st">Aucun exercice sous 60 %. Refais les erreurs et passe au sujet suivant.</p>`);
}
function initSujets(){
  SUJETS.forEach(S=>sjUpdate(S.n));
  $('#app').oninput=e=>{
    const t=e.target.closest('[data-sc]');if(!t)return;
    const [n]=t.dataset.sc.split('-');
    state.scores[t.dataset.sc]=t.value.trim();save();sjUpdate(+n);
  };
}
let PDFJ=null;
function pdfBlob(key){
  if(!PDFJ){try{PDFJ=JSON.parse(document.getElementById('pdfdata').textContent);}catch(e){PDFJ={};}}
  const b64=PDFJ[key];if(!b64)return null;
  const bin=atob(b64),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:'application/pdf'});
}
async function getDownloads(){return null;}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-dl]');if(!b)return;
  const msg=$('#dlmsg');const say=t=>{if(msg)msg.textContent=t;};
  say('Préparation du fichier…');
  const blob=pdfBlob(b.dataset.dl);
  if(!blob){say('Fichier introuvable dans la page.');return;}
  const d=await getDownloads();
  if(!d){
    try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=b.dataset.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);say('Téléchargement lancé : '+b.dataset.name);}
    catch(err){say('Téléchargement impossible dans ce navigateur.');}
    return;
  }
  try{await d.save({filename:b.dataset.name,data:blob});say('Enregistré : '+b.dataset.name);}
  catch(err){say(err&&err.code==='declined'?'Téléchargement annulé.':'Téléchargement impossible ('+((err&&err.code)||'erreur')+').');}
});

/* ================= routage ================= */
const RENDER={home:renderHome,ch1:renderCh1,ch2:renderCh2,ch3:renderCh3,ch4:renderCh4,ch5:renderCh5,ch6:renderCh6,flash:renderFlash,quiz:renderQuiz,sujets:renderSujets,sheet:renderSheet};
const INIT={ch1:initCh1,ch2:initCh2,ch3:initCh3,ch4:initCh4,ch5:initCh5,ch6:initCh6,flash:initFlash,quiz:initQuiz,sujets:initSujets};
// associer chaque générateur à son chapitre (pour le filtre du quiz)
GEN.forEach(g=>{try{g.__ch=g().ch;}catch(e){g.__ch=0;}});

function buildNav(){$('#nav').innerHTML=VIEWS.map(v=>`<a href="#${v.id}" data-id="${v.id}">${v.label}</a>`).join('');}
function route(){
  let id=(location.hash||'#home').slice(1);
  if(!RENDER[id])id='home';
  $('#app').innerHTML=RENDER[id]();
  if(INIT[id])INIT[id]();
  $$('#nav a').forEach(a=>{const on=a.dataset.id===id;a.classList.toggle('on',on);if(on){a.setAttribute('aria-current','page');try{a.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}}else a.removeAttribute('aria-current');});
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='toggle-done'){const id=b.dataset.ch;state.done[id]=!state.done[id];save();b.className='btn '+(state.done[id]?'':'ghost');b.textContent=state.done[id]?'✓ Chapitre révisé':'Marquer comme révisé';}
  else if(b.dataset.act==='quiz-ch'){quizScope=b.dataset.ch;quiz=null;location.hash='#quiz';}
});
window.addEventListener('hashchange',route);

/* thème */
(function(){
  let t=null;try{t=localStorage.getItem('proba-theme');}catch(e){}
  if(t)document.documentElement.setAttribute('data-theme',t);
  $('#themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const nx=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',nx);
    try{localStorage.setItem('proba-theme',nx);}catch(e){}
  });
})();
buildNav();route();
})();
</script>
